<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#1a1d27"/>
  
  <!-- Laptop body -->
  <rect x="5" y="9" width="22" height="14" rx="2" fill="#2e3347"/>
  <rect x="6.5" y="10.5" width="19" height="11" rx="1" fill="#4f8ef7"/>
  
  <!-- Screen shine effect -->
  <rect x="6.5" y="10.5" width="9" height="11" rx="1" fill="#38d9a9" opacity="0.25"/>
  
  <!-- CC letters on screen -->
  <text x="16" y="18" font-family="monospace" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">CC</text>
  
  <!-- Laptop base -->
  <rect x="3" y="23" width="26" height="2" rx="1" fill="#2e3347"/>
  <rect x="11" y="22.5" width="10" height="1" rx="0.5" fill="#22263a"/>
</svg>
